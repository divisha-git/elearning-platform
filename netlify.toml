# Netlify configuration for Vite React frontend
# Frontend build output is in dist/
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[functions."api"]
  included_files = [
    "backend/**"
  ]

# Redirect API calls to deployed backend
# Route frontend calls to Netlify Function handler
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
